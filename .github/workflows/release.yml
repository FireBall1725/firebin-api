name: Release

# The release itself lives in FireBall1725/workflows. The version is computed
# from the date and the tag list as YY.M.revision; nothing in the source tree
# carries a version string.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: rc
        type: choice
        options:
          - rc
          - stable
      dry-run:
        description: Compute and build, but push nothing and tag nothing
        required: false
        default: false
        type: boolean
      force-version:
        description: Re-cut this exact version instead of computing the next one
        required: false
        default: ""
        type: string

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: FireBall1725/workflows/.github/workflows/release-container.yml@v1
    with:
      image: ghcr.io/fireball1725/firebin-api
      channel: ${{ inputs.channel }}
      dry-run: ${{ inputs.dry-run }}
      force-version: ${{ inputs.force-version }}
      # rc and stable pin themselves into homelab-applications via an
      # auto-merging PR. Nightly never deploys, whatever this says.
      deploy-app: firebin-api
    secrets: inherit
