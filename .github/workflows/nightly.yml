name: Nightly

# Every merge to main publishes an image and nothing else: no git tag, no
# GitHub Release, no Discord post.
#
#   docker pull ghcr.io/fireball1725/firebin-api:nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    permissions:
      contents: read
      packages: write
    uses: FireBall1725/workflows/.github/workflows/release-container.yml@v1
    with:
      image: ghcr.io/fireball1725/firebin-api
      channel: nightly
    secrets: inherit
