basePath: /api/v1
definitions:
  github_com_firelabsca_firebin-api_internal_kicad.BBoxExtent:
    properties:
      maxx:
        type: number
      maxy:
        type: number
      minx:
        type: number
      miny:
        type: number
    type: object
  github_com_firelabsca_firebin-api_internal_kicad.DrawItem:
    properties:
      angle:
        description: pad rotation, degrees clockwise
        type: number
      center:
        description: circle
        items:
          type: number
        type: array
      drill:
        type: number
      fill:
        description: Fill is "none", "outline" or "background", straight from KiCad.
        type: string
      layer:
        description: F | B for pads, silk for outlines
        type: string
      number:
        description: pad number; empty for mechanical pads
        type: string
      points:
        description: |-
          Points is the polyline for Type "line", and the pad centre (single
          point) for Type "pad".
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      r:
        description: circle
        type: number
      shape:
        description: 'pad: rect | roundrect | circle | oval'
        type: string
      size:
        description: pad
        items:
          type: number
        type: array
      type:
        type: string
      w:
        description: stroke width
        type: number
    type: object
  github_com_firelabsca_firebin-api_internal_kicad.LibDrawing:
    properties:
      bbox:
        $ref: '#/definitions/github_com_firelabsca_firebin-api_internal_kicad.BBoxExtent'
      electrical_pads:
        type: integer
      items:
        items:
          $ref: '#/definitions/github_com_firelabsca_firebin-api_internal_kicad.DrawItem'
        type: array
      kind:
        description: symbol | footprint
        type: string
      pins:
        description: |-
          Pins counts a symbol's pins. ElectricalPads counts a footprint's numbered
          pads, ignoring repeats (a split pad shares one number) and mechanical pads
          (mounting holes carry no number). Together they let a caller sanity-check
          a symbol/footprint pairing without re-parsing anything.
        type: integer
    type: object
  github_com_firelabsca_firebin-api_internal_models.APIToken:
