# golangci-lint v2 configuration for firebin-api.
#
# Keep this in step with the runner pinned in .github/workflows/ci.yml:
# golangci-lint-action@v8 with version v2.11.4. Older action majors install a
# v1 binary, which rejects this file outright with "unsupported version of the
# configuration".
#
# What's enabled:
#
#   standard set: errcheck, govet, ineffassign, staticcheck, unused
#   bodyclose:    the provider adapters (Digi-Key, Nexar, Ollama) are HTTP
#                 clients; a leaked response body leaks a file descriptor per
#                 enrichment call
#   misspell:     typos in user-facing strings, doc comments, errors
#
# What's disabled (and why):
#
#   gocritic    — worth having, but it flags a batch of stylistic issues across
#                 the existing tree. Re-enable in a focused cleanup PR rather
#                 than burying the findings in an unrelated diff.
version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
  # Generated code is covered by its generator's own quality bar (swag for
  # docs/, etc.) — keep it out of the linter's scope.
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: _test\.go
  settings:
    errcheck:
      # Conventional patterns where the unchecked error is intentional:
      #   - `defer tx.Rollback(ctx)` after a successful `Commit` is a
      #     documented pgx pattern; the second call returns ErrTxClosed and
      #     we don't care.
      #   - `defer rows.Close()` is the canonical pgx idiom.
      #   - `w.Write(...)` on response writers — middleware downstream of us
      #     handles the actual I/O failure path.
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (github.com/jackc/pgx/v5.Rows).Close
        # Same idiom as Rows.Close, for the batched path in the KiCad
        # repository: the per-Exec errors are what carry the failure.
        - (github.com/jackc/pgx/v5.BatchResults).Close
        - (net/http.ResponseWriter).Write
        # Deferred Close on a gzip reader after ReadAll has already returned
        # whatever went wrong.
        - (*compress/gzip.Reader).Close
        # Deferred Close on file handles, response bodies, and other
        # io.Closer implementations — convention is to ignore the close
        # error, the read/write path already surfaced anything fatal.
        - (io.Closer).Close
        # JSON encoders here write directly to the ResponseWriter; an I/O
        # failure surfaces via the writer, not the encoder return.
        - (*encoding/json.Encoder).Encode

# gofmt is enforced so the tree stays clean and outside PRs stop carrying
# unrelated whitespace churn from editors that format on save. Run
# `golangci-lint fmt` to fix locally.
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
